name: Sync public contribution calendar

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate self-hosted contribution artwork
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = 'ismail-code-ai';
            const query = `query($username: String!) {
              user(login: $username) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }`;
            const response = await github.graphql(query, { username });
            const calendar = response.user.contributionsCollection.contributionCalendar;
            const weeks = calendar.weeks.slice(-53);
            const escape = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            const palette = ['#242925', '#284c32', '#367e45', '#46ad56', '#72dc79'];
            const intensity = n => n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : n < 10 ? 3 : 4;
            const squares = weeks.map((week, x) => week.contributionDays.map(day => {
              const weekday = new Date(day.date + 'T00:00:00Z').getUTCDay();
              return `<rect x="${58 + x * 14.4}" y="${109 + weekday * 19}" width="11" height="13" rx="2" fill="${palette[intensity(day.contributionCount)]}"><title>${escape(day.date)}: ${day.contributionCount} contributions</title></rect>`;
            }).join('')).join('');
            const months = weeks.map((week, index) => {
              const first = week.contributionDays[0];
              if (!first) return '';
              const date = new Date(first.date + 'T00:00:00Z');
              if (date.getUTCDate() > 7 || index % 1 !== 0) return '';
              const label = date.toLocaleString('en-US', { month: 'short', timeZone: 'UTC' }).toUpperCase();
              return `<text x="${58 + index * 14.4}" y="99" font-size="13" font-family="monospace" fill="#b6aa99">${label}</text>`;
            }).join('');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-label="GitHub public contribution activity: ${calendar.totalContributions} contributions in the past year">
              <rect width="1120" height="290" rx="6" fill="#101115"/>
              <rect x="10" y="10" width="1100" height="270" fill="none" stroke="#8d8172"/>
              <path d="M20 20h30M20 20v30M1100 20h-30M1100 20v30" stroke="#ed8438" stroke-width="3"/>
              <text x="44" y="58" font-family="monospace" font-size="25" font-weight="bold" fill="#eee5d9">ACTIVITY INTELLIGENCE</text>
              <text x="1065" y="56" text-anchor="end" font-family="monospace" font-size="14" fill="#ed8438">SOURCE / GITHUB</text>
              <path d="M44 75h1026" stroke="#d58a50" opacity=".7"/>
              ${months}
              <text x="24" y="128" font-family="monospace" font-size="12" fill="#b0a89a">SUN</text>
              <text x="24" y="185" font-family="monospace" font-size="12" fill="#b0a89a">WED</text>
              <text x="24" y="241" font-family="monospace" font-size="12" fill="#b0a89a">SAT</text>
              ${squares}
              <path d="M842 91v150" stroke="#8d8172" opacity=".65"/>
              <text x="870" y="154" font-family="monospace" font-size="49" font-weight="bold" fill="#7bd983">${calendar.totalContributions}</text>
              <text x="870" y="184" font-family="monospace" font-size="15" fill="#d8cebe">CONTRIBUTIONS</text>
              <text x="870" y="208" font-family="monospace" font-size="13" fill="#a69a89">PAST YEAR / PUBLIC</text>
              <text x="870" y="236" font-family="monospace" font-size="13" fill="#ed8438">SYNC / DAILY</text>
              </svg>`;
            const encoded = Buffer.from(svg).toString('base64');
            const path = 'assets/activity.svg';
            const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path });
            const current = Buffer.from(existing.data.content, 'base64').toString('utf8');
            if (current === svg) {
              core.info('Calendar artwork already up to date');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              sha: existing.data.sha,
              message: 'chore: update public contribution artwork [skip ci]',
              content: encoded
            });
